# Probetron rig SSH policy.
# This file sorts first, so every value here wins over any later drop-in.
# The lab LAN is the whole trust boundary, so one public key is the only
# credential and nothing else may log in.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers probetron

# The rig never resolves a name, so sshd must never wait for a resolver.
UseDNS no

# A session forwards one loopback port and carries no terminal or display.
AllowTcpForwarding yes
GatewayPorts no
AllowAgentForwarding no
PermitTunnel no
X11Forwarding no

# Reap a dead client within a minute, so its rig cleanup releases the target
# lock instead of holding it until somebody reboots the Pi.
TCPKeepAlive yes
ClientAliveInterval 15
ClientAliveCountMax 4
