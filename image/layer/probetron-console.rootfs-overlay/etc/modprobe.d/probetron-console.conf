# Both ends of the console link keep one address across every boot.
# g_ether invents a random pair otherwise, and a client that sees a new
# hardware address on every cable insertion files a new network interface for
# each one, which is how a laptop ends up configuring the same rig ten times.
# Both are locally administered addresses, so neither can collide with real
# hardware, and dev_addr belongs to the rig while host_addr belongs to the
# client end of the same cable.
options g_ether dev_addr=02:11:22:33:44:01 host_addr=02:11:22:33:44:02
